services:
  api:
    build: .
    image: relyfetal-api
    container_name: relyfetal-api
    ports:
      - "8000:8000"
    environment:
      RELYFETAL_TORCH_THREADS: "2"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    # The model is 0.48 MB; 1 GB is generous and keeps the container off the host's RAM.
    mem_limit: 1g
    cpus: "2.0"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
