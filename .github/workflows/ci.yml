name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Smoke tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy scikit-learn mne wfdb ripser pytest
          pip install fastapi uvicorn httpx python-multipart
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      # Data-dependent cases (ADFECGDB, Silesia) skip on the runner. ripser is installed above because
      # the default learned confidence gate imports fsqi/fsqi.py, which imports ripser at module level;
      # the API tests run against the checked-in checkpoints via fastapi.testclient.
      - name: Run tests
        run: pytest tests/ demo/test_core.py -v

      - name: Check every source file compiles
        run: |
          python -m compileall -q model benchmark_dpss pilot_evidence tests api demo baselines fsqi
